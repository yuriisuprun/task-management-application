spring.application.name=demo

# ========== DATABASE ==========
# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/taskdb
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA/HIBERNATE ==========
# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ========== FLYWAY ==========
# Disable Spring Boot's auto Flyway configuration (we handle it manually)
spring.flyway.enabled=false

# ========== WEB ==========
# Suppress favicon error
spring.mvc.favicon.enabled=false

# ========== LOGGING ==========
# Set logging levels
logging.level.root=INFO
logging.level.com.taskmanagement=DEBUG
logging.level.org.springframework.web=INFO

# Suppress Spring Data PageImpl serialization warning
logging.level.org.springframework.data.repository.config=WARN

# ========== ERROR HANDLING ==========
# Return JSON for error responses
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# ========== PAGINATION ==========
# Spring Data Web Configuration
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.one-indexed-parameters=false
